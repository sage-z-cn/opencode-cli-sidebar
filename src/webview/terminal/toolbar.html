<div id="toolbar" class="toolbar">
  <div class="toolbar-context">
    <div class="pill-host" id="pill-ai-tool">
      <button type="button" class="toolbar-pill" id="btn-pill-ai-tool" data-single="true" aria-label="OpenCode">
        <span class="pill-label" id="pill-ai-tool-label">OpenCode</span>
      </button>
    </div>
    <button
      type="button"
      id="btn-oc-version"
      class="ocu-pill hidden"
      aria-label="{{t:openCodeUpdate}}"
    >
      <span class="ocu-pill-text" id="ocu-version-text"></span>
    </button>
  </div>
  <div class="toolbar-controls">
  </div>
  <div class="toolbar-right">
    <button
      type="button"
      id="btn-restart"
      class="toolbar-btn"
      aria-label="Restart Terminal"
      title="{{t:restart}}"
    >
      {{icon:rotateCw}}
    </button>
    <div class="font-size-host">
      <button
        type="button"
        id="btn-font-increase"
        class="toolbar-btn"
        aria-label="Increase Font Size"
        title="{{t:fontIncrease}}"
      >
        A+
      </button>
      <div class="font-size-tooltip hidden" id="font-size-tooltip" role="status" aria-live="polite"></div>
      <button
        type="button"
        id="btn-font-decrease"
        class="toolbar-btn"
        aria-label="Decrease Font Size"
        title="{{t:fontDecrease}}"
      >
        A&#x2212;
      </button>
    </div>
    <div class="toolbar-sep hidden" id="toolbar-sep-font-oc" aria-hidden="true"></div>
    <button
      type="button"
      id="btn-oc-agents-md"
      class="toolbar-btn hidden"
      aria-label="{{t:openCodeGlobalAgentsMd}}"
      title="{{t:openCodeGlobalAgentsMd}}"
    >
      {{icon:bot}}
    </button>
    <button
      type="button"
      id="btn-oc-config-json"
      class="toolbar-btn hidden"
      aria-label="{{t:openCodeGlobalConfig}}"
      title="{{t:openCodeGlobalConfig}}"
    >
      {{icon:fileJson}}
    </button>
    <button
      type="button"
      id="btn-oc-cli-settings"
      class="toolbar-btn hidden"
      aria-label="{{t:openCodeCliSettings}}"
      title="{{t:openCodeCliSettings}}"
    >
      <!-- Icon from VSCode Icons by Roberto Huertas - https://github.com/vscode-icons/vscode-icons/blob/master/LICENSE -->
      <span class="oc-ic">
        <svg class="oc-ic-l" width="14" height="14" viewBox="0 0 32 32" aria-hidden="true"><g fill="none"><g clip-path="url(#oc-ic-clip-l)" transform="translate(4.8 2)scale(.09333)"><mask id="oc-ic-mask-l" width="240" height="300" x="0" y="0" maskUnits="userSpaceOnUse"><path fill="#fff" d="M240 0H0v300h240z"/></mask><g mask="url(#oc-ic-mask-l)"><path fill="#cfcecd" d="M180 240H60V120h120z"/><path fill="#211e1e" d="M180 60H60v180h120zm60 240H0V0h240z"/></g></g><defs><clipPath id="oc-ic-clip-l"><path fill="#fff" d="M0 0h240v300H0z"/></clipPath></defs></g></svg>
        <svg class="oc-ic-d" width="14" height="14" viewBox="0 0 32 32" aria-hidden="true"><g fill="none"><g clip-path="url(#oc-ic-clip-d)" transform="translate(4.8 2)scale(.09333)"><mask id="oc-ic-mask-d" width="240" height="300" x="0" y="0" maskUnits="userSpaceOnUse"><path fill="#d2d2d2" d="M240 0H0v300h240z"/></mask><g mask="url(#oc-ic-mask-d)"><path fill="#4b4646" d="M180 240H60V120h120z"/><path fill="#f1ecec" d="M180 60H60v180h120zm60 240H0V0h240z"/></g></g><defs><clipPath id="oc-ic-clip-d"><path fill="#fff" d="M0 0h240v300H0z"/></clipPath></defs></g></svg>
      </span>
    </button>
    <button
      type="button"
      id="btn-keymap"
      class="toolbar-btn hidden"
      aria-label="{{t:keymap}}"
      title="{{t:keymap}}"
    >
      {{icon:keyboard}}
    </button>
    <button
      type="button"
      id="btn-dav-sync-panel"
      class="toolbar-btn dav-sync-entry hidden"
      aria-haspopup="dialog"
      aria-label="{{t:davOpenPanel}}"
      title="{{t:davOpenPanel}}"
    >
      <span class="dav-sync-glyph" id="dav-sync-glyph">{{icon:cloudCog}}</span>
    </button>
    <div class="toolbar-sep hidden" id="toolbar-sep-oc-settings" aria-hidden="true"></div>
    <div class="settings-host">
      <button
        type="button"
        id="btn-settings"
        class="toolbar-btn"
        aria-label="Open Extension Settings"
        title="{{t:settings}}"
      >
        {{icon:settings}}
      </button>
      <div class="settings-dropdown hidden" id="dropdown-settings" role="menu">
        <div class="settings-option" role="menuitem" data-action="resetFontSize">
          {{icon:rotateCcw:13}} {{t:fontReset}}
        </div>
        <div class="settings-option hidden" role="menuitem" data-action="checkOpenCodeUpdate" id="menu-oc-update-check">
          {{icon:refresh:13}} {{t:checkOpenCodeUpdates}}
        </div>
        <div class="settings-option" role="menuitem" data-action="toggleEditor">
          <span id="settings-toggle-editor-icon">{{icon:arrowUpRight}}</span>
          <span id="settings-toggle-editor-label">{{t:toggleEditor}}</span>
        </div>
        <div class="settings-option" role="menuitem" data-action="keyboardShortcuts">
          {{icon:keyboard:13}} {{t:keybindSettings}}
        </div>
        <div class="settings-option" role="menuitem" data-action="settings">
          {{icon:settings:13}} {{t:extensionSettings}}
        </div>
      </div>
    </div>
  </div>
</div>
